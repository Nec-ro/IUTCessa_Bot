services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iutcessa}
      POSTGRES_USER: ${POSTGRES_USER:-iutcessa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  iutcessa-bot:
    build:
      context: .
      dockerfile: src/Dockerfile
    image: iutcessa-bot:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # if you prefer a single URL instead of individual vars:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://iutcessa:changeme@db:5432/iutcessa}
    command: bash -lc "alembic upgrade head || true; python src/main.py"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src:rw

volumes:
  pgdata: